
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCU LMS AI Assignment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Inter, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [mode, setMode] = useState("login");
      const [accessMode, setAccessMode] = useState("");
      const [token, setToken] = useState("");
      const [user, setUser] = useState(null);
      const [connected, setConnected] = useState(false);

      const [studentId, setStudentId] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [email, setEmail] = useState("");

      // Independent show/hide controls for each password field.
      const [showPassword, setShowPassword] = useState(false);
      const [showGuestLmsPassword, setShowGuestLmsPassword] = useState(false);
      const [showLmsPassword, setShowLmsPassword] = useState(false);

      const [lmsId, setLmsId] = useState("");
      const [lmsPassword, setLmsPassword] = useState("");

      const [assignments, setAssignments] = useState([]);
      const [selected, setSelected] = useState(null);
      const [answer, setAnswer] = useState("");

      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState("");

      const [message, setMessage] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);
      const [safeMode, setSafeMode] = useState(true);

      function notify(text) {
        setMessage(text);
        setError("");
      }

      function fail(text) {
        setError(text);
        setMessage("");
      }

      async function api(path, options = {}, useToken = true) {
        const headers = {
          "Content-Type": "application/json",
          ...(options.headers || {})
        };

        if (useToken && token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const response = await fetch(path, {
          ...options,
          headers
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            typeof data.detail === "string"
              ? data.detail
              : JSON.stringify(data.detail || data)
          );
        }

        return data;
      }

      // REGISTERED STUDENT LOGIN / REGISTRATION

      async function handleAuth(e) {
        e.preventDefault();
        setLoading(true);
        setError("");

        try {
          const endpoint = mode === "login"
            ? "/api/auth/login"
            : "/api/auth/register";

          const payload = mode === "login"
            ? {
                student_id: studentId.trim(),
                password
              }
            : {
                student_id: studentId.trim(),
                password,
                full_name: fullName.trim(),
                email: email.trim().toLowerCase()
              };

          const data = await api(endpoint, {
            method: "POST",
            body: JSON.stringify(payload)
          }, false);

          // With email confirmation enabled, Supabase may create the account
          // without issuing a session. Do not treat an empty token as logged in.
          if (mode === "register" && !data.token) {
            setPassword("");
            setMode("login");
            notify(data.message || "Account created. Check your email to confirm your account, then log in.");
            return;
          }

          if (!data.token) {
            throw new Error("Authentication succeeded without an access token. Please try logging in again.");
          }

          setToken(data.token);
          setUser(data.user);
          setAccessMode("registered");
          setConnected(false);
          setLmsId(data.user?.scu_student_id || studentId);
          notify("Platform login successful. Now connect your SCU LMS account.");

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // GUEST CONNECTION

      async function connectGuest(e) {
        e.preventDefault();
        setLoading(true);
        setError("");

        try {
          const data = await api("/api/guest/connect", {
            method: "POST",
            body: JSON.stringify({
              lms_student_id: lmsId.trim(),
              lms_password: lmsPassword
            })
          }, false);

          setToken(data.access_token);
          setUser({ full_name: "Guest Student", scu_student_id: lmsId });
          setAccessMode("guest");
          setConnected(true);
          setLmsPassword("");
          notify("Guest LMS connection successful!");

          await scanAssignments(data.access_token, "guest");

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // REGISTERED LMS CONNECTION

      async function connectLMS(e) {
        e.preventDefault();
        setLoading(true);
        setError("");

        try {
          await api("/api/lms/connect", {
            method: "POST",
            body: JSON.stringify({
              lms_student_id: lmsId.trim(),
              lms_password: lmsPassword
            })
          });

          setConnected(true);
          setLmsPassword("");
          notify("Your SCU LMS account is connected successfully!");

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // SCAN LIVE LMS ASSIGNMENTS

      async function scanAssignments(existingToken = token, type = accessMode) {
        setLoading(true);
        setError("");
        setMessage("Scanning your SCU LMS assignments...");

        try {
          const endpoint = type === "guest"
            ? "/api/guest/assignments"
            : "/api/workflow/assignments";

          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${existingToken}`
            }
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Could not scan LMS assignments.");
          }

          const items = Array.isArray(data)
            ? data
            : data.assignments || [];

          setAssignments(items);
          setSelected(null);
          setAnswer("");
          setChatMessages([]);
          setChatInput("");

          notify(`Scan complete. Found ${items.length} assignments.`);

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // ASSIGNMENT INFORMATION

      function getCourse(item) {
        return item.course_name_english ||
          item.course_name ||
          item.course_name_original ||
          "SCU Course";
      }

      function getTitle(item) {
        return item.assignment_title_english ||
          item.assignment_title ||
          item.assignment_title_original ||
          "Assignment";
      }

      function getInstructions(item) {
        return item.instructions ||
          item.description ||
          item.assignment_description ||
          "";
      }

      function getAssignmentUrl(item) {
        return item.assignment_url ||
          item.url ||
          item.link ||
          "";
      }

      // DETECT ASSIGNMENT SUBMISSION FORMAT.
      // T = Text, F = File, FT = Text + File.
      // Unknown or conflicting information returns null.

      function getSubmissionType(item) {
        const fields = [
          item.submission_type,
          item.assignment_type,
          item.format,
          item.format_english,
          item.format_original,
          item.submission_format
        ];

        const detected = [];

        for (const field of fields) {
          if (
            field === null ||
            field === undefined ||
            field === ""
          ) {
            continue;
          }

          const value = String(field)
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "");

          let type = null;

          // Text + file
          if (
            value === "ft" ||
            value.includes("text+file") ||
            value.includes("file+text") ||
            value.includes("textandfile") ||
            value.includes("both") ||
            value.includes("텍스트+파일") ||
            value.includes("파일+텍스트")
          ) {
            type = "FT";
          }

          // Text only
          else if (
            value === "t" ||
            value.includes("text") ||
            value.includes("텍스트")
          ) {
            type = "T";
          }

          // File only
          else if (
            value === "f" ||
            value.includes("file") ||
            value.includes("pdf") ||
            value.includes("파일") ||
            value.includes("첨부")
          ) {
            type = "F";
          }

          if (type) {
            detected.push(type);
          }
        }

        const uniqueTypes = [...new Set(detected)];

        if (uniqueTypes.length !== 1) {
          return null;
        }

        return uniqueTypes[0];
      }

      function getSubmissionLabel(type) {
        if (type === "T") return "Text submission";
        if (type === "F") return "File / PDF submission";
        if (type === "FT") return "Text + File submission";
        return "Unknown submission format";
      }

      // CHATBOT ENDPOINT

      function getChatEndpoint() {
        return accessMode === "guest"
          ? "/api/workflow/guest/chat"
          : "/api/workflow/chat";
      }

      // SELECT ASSIGNMENT AND ASK GEMINI TO READ IT

      async function chooseAssignment(item) {
        console.log("SELECTED ASSIGNMENT DATA:", item);

        setSelected(item);
        setAnswer("");
        setChatInput("");
        setChatMessages([]);
        setError("");
        setMessage("");

        setLoading(true);

        try {
          const data = await api(getChatEndpoint(), {
            method: "POST",
            body: JSON.stringify({
              course_name: getCourse(item),
              assignment_title: getTitle(item),
              instructions: getInstructions(item),
              messages: []
            })
          });

          setChatMessages([
            {
              role: "assistant",
              content: data.reply
            }
          ]);

        } catch (err) {
          fail(err.message);
          setChatMessages([
            {
              role: "assistant",
              content: "I couldn't connect to Gemini. Please check your connection and try again."
            }
          ]);
        } finally {
          setLoading(false);
        }
      }

      // SEND CHAT MESSAGE

      async function sendChatMessage(e) {
        if (e) e.preventDefault();

        if (!selected || !chatInput.trim() || loading) return;

        const userMessage = {
          role: "user",
          content: chatInput.trim()
        };

        const updatedMessages = [
          ...chatMessages,
          userMessage
        ];

        setChatMessages(updatedMessages);
        setChatInput("");
        setLoading(true);
        setError("");

        try {
          const data = await api(getChatEndpoint(), {
            method: "POST",
            body: JSON.stringify({
              course_name: getCourse(selected),
              assignment_title: getTitle(selected),
              instructions: getInstructions(selected),
              messages: updatedMessages
            })
          });

          setChatMessages([
            ...updatedMessages,
            {
              role: "assistant",
              content: data.reply
            }
          ]);

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // GENERATE WITH GEMINI

      async function generateAnswer() {
        if (!selected || loading) return;

        setLoading(true);
        setError("");
        notify("Gemini is generating your assignment answer...");

        try {
          const endpoint = accessMode === "guest"
            ? "/api/workflow/guest/generate"
            : "/api/workflow/generate";

          const studentNotes = chatMessages
            .filter(m => m.role === "user")
            .map(m => m.content)
            .join("\n");

          const data = await api(endpoint, {
            method: "POST",
            body: JSON.stringify({
              course_name: getCourse(selected),
              assignment_title: getTitle(selected),
              instructions: getInstructions(selected),
              custom_instructions: studentNotes
            })
          });

          setAnswer(data.answer || "");
          notify(`Answer generated successfully using ${data.model_used || "Gemini"}. Please review it.`);

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // APPROVE AND TEST ASSIGNMENT SUBMISSION

      async function submitAssignment() {
        if (!selected || !answer.trim()) {
          fail("Select an assignment and generate an answer first.");
          return;
        }

        const submissionType = getSubmissionType(selected);

        // Never guess the submission format.
        if (!submissionType) {
          console.error("Unknown assignment format:", selected);

          fail(
            "The assignment submission format could not be identified. " +
            "Please stop here. We need to check the scanner data before submitting."
          );
          return;
        }

        const assignmentUrl = getAssignmentUrl(selected);

        if (!assignmentUrl) {
          fail("The assignment URL was not found in the scan result. We need to fix the scanner before submitting.");
          return;
        }

        const submissionLabel = getSubmissionLabel(submissionType);

        const testDescription = submissionType === "T"
          ? "This will test text insertion into the LMS. It will NOT finalize the LMS submission."
          : submissionType === "F"
            ? "This will test PDF creation and file attachment. It will NOT finalize the LMS submission."
            : "This will test both text insertion and PDF attachment. It will NOT finalize the LMS submission.";

        const confirmed = window.confirm(
          safeMode
            ? `Run safe test mode for ${submissionLabel}?\n\n${testDescription}`
            : `Live submission mode is selected for ${submissionLabel}.\n\nContinue only after verifying the LMS submission process.`
        );

        if (!confirmed) return;

        setLoading(true);
        setError("");
        notify(`Preparing ${submissionLabel} and connecting to SCU LMS...`);

        try {
          const endpoint = accessMode === "guest"
            ? "/api/workflow/guest/submit"
            : "/api/workflow/submit";

          const data = await api(endpoint, {
            method: "POST",
            body: JSON.stringify({
              course_name: getCourse(selected),
              assignment_title: getTitle(selected),
              instructions: getInstructions(selected),
              custom_instructions: "",
              solution_markdown: answer,
              text_content: submissionType === "T" || submissionType === "FT"
                ? answer
                : null,
              submission_type: submissionType,
              assignment_url: assignmentUrl,
              student_approved: true,
              safe_test_mode: safeMode
            })
          });

          notify(
            `${data.message || "Workflow completed."} ${data.next_step || ""}`
          );

        } catch (err) {
          fail(err.message);
        } finally {
          setLoading(false);
        }
      }

      // LOGOUT

      async function logout() {
        if (accessMode === "guest" && token) {
          try {
            await fetch("/api/guest/disconnect", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`
              }
            });
          } catch (e) {
            console.error(e);
          }
        }

        setToken("");
        setUser(null);
        setAccessMode("");
        setConnected(false);
        setAssignments([]);
        setSelected(null);
        setAnswer("");
        setChatMessages([]);
        setChatInput("");
        setMessage("");
        setError("");
      }

      // LOGIN PAGE

      if (!accessMode) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">
              <div className="text-center mb-7">
                <div className="bg-blue-950 text-white w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold mb-4">
                  SCU
                </div>
                <h1 className="text-2xl font-bold">SCU LMS AI Platform</h1>
                <p className="text-sm text-slate-500 mt-2">
                  AI-powered assignment assistant
                </p>
              </div>

              {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4">{error}</div>}

              <form onSubmit={handleAuth} className="space-y-4">
                <h2 className="font-semibold text-lg">
                  {mode === "login" ? "Student Login" : "Create Account"}
                </h2>

                <input
                  className="w-full border rounded-lg p-3"
                  placeholder="SCU Student ID"
                  value={studentId}
                  onChange={e => setStudentId(e.target.value)}
                  required
                />

                {mode === "register" && <>
                  <input
                    className="w-full border rounded-lg p-3"
                    placeholder="Full name"
                    value={fullName}
                    onChange={e => setFullName(e.target.value)}
                    required
                  />
                  <input
                    className="w-full border rounded-lg p-3"
                    placeholder="Gmail address"
                    type="email"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    autoComplete="email"
                    required
                  />
                </>}

                <div className="relative">
                  <input
                    className="w-full border rounded-lg p-3 pr-16"
                    placeholder="Application password"
                    type={showPassword ? "text" : "password"}
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    autoComplete={mode === "login" ? "current-password" : "new-password"}
                    required
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(value => !value)}
                    aria-label={showPassword ? "Hide password" : "Show password"}
                    aria-pressed={showPassword}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-blue-700"
                  >
                    {showPassword ? "Hide" : "Show"}
                  </button>
                </div>

                <button disabled={loading} className="w-full bg-blue-950 text-white p-3 rounded-lg font-semibold disabled:opacity-50">
                  {loading ? "Please wait..." : mode === "login" ? "Sign In" : "Register"}
                </button>
              </form>

              <div className="text-center text-sm mt-5">
                <button
                  className="text-blue-700 underline"
                  onClick={() => {
                    setMode(mode === "login" ? "register" : "login");
                    setError("");
                  }}
                >
                  {mode === "login" ? "Create an account" : "Back to login"}
                </button>
              </div>

              <div className="border-t my-6"></div>

              <button
                onClick={() => {
                  setAccessMode("guest-setup");
                  setError("");
                }}
                className="w-full border border-blue-900 text-blue-900 p-3 rounded-lg font-semibold"
              >
                Continue as Guest Student
              </button>

              <p className="text-xs text-slate-400 text-center mt-3">
                Guest access uses a temporary two-hour session.
              </p>
            </div>
          </div>
        );
      }

      // GUEST SETUP PAGE

      if (accessMode === "guest-setup") {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={connectGuest} className="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 space-y-4">
              <h1 className="text-2xl font-bold">Guest LMS Connection</h1>
              <p className="text-sm text-slate-500">
                Enter your own SCU LMS credentials. No platform registration is required.
              </p>

              {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm">{error}</div>}

              <input
                className="w-full border rounded-lg p-3"
                placeholder="SCU Student ID"
                value={lmsId}
                onChange={e => setLmsId(e.target.value)}
                required
              />

              <div className="relative">
                <input
                  className="w-full border rounded-lg p-3 pr-16"
                  placeholder="SCU LMS Password"
                  type={showGuestLmsPassword ? "text" : "password"}
                  value={lmsPassword}
                  onChange={e => setLmsPassword(e.target.value)}
                  autoComplete="current-password"
                  required
                />
                <button
                  type="button"
                  onClick={() => setShowGuestLmsPassword(value => !value)}
                  aria-label={showGuestLmsPassword ? "Hide SCU LMS password" : "Show SCU LMS password"}
                  aria-pressed={showGuestLmsPassword}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-blue-700"
                >
                  {showGuestLmsPassword ? "Hide" : "Show"}
                </button>
              </div>

              <button disabled={loading} className="w-full bg-blue-950 text-white p-3 rounded-lg font-semibold">
                {loading ? "Connecting..." : "Connect and Scan Assignments"}
              </button>

              <button
                type="button"
                onClick={() => setAccessMode("")}
                className="w-full border p-3 rounded-lg"
              >
                Back
              </button>
            </form>
          </div>
        );
      }

      // REGISTERED LMS CONNECTION PAGE

      if (accessMode === "registered" && !connected) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={connectLMS} className="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 space-y-4">
              <h1 className="text-2xl font-bold">Connect SCU LMS</h1>
              <p className="text-sm text-slate-500">
                Welcome, {user?.full_name}. Connect your personal university LMS account.
              </p>

              {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm">{error}</div>}
              {message && <div className="bg-green-50 text-green-700 p-3 rounded-lg text-sm">{message}</div>}

              <input
                className="w-full border rounded-lg p-3"
                placeholder="SCU Student ID"
                value={lmsId}
                onChange={e => setLmsId(e.target.value)}
                required
              />

              <div className="relative">
                <input
                  className="w-full border rounded-lg p-3 pr-16"
                  placeholder="SCU LMS Password"
                  type={showLmsPassword ? "text" : "password"}
                  value={lmsPassword}
                  onChange={e => setLmsPassword(e.target.value)}
                  autoComplete="current-password"
                  required
                />
                <button
                  type="button"
                  onClick={() => setShowLmsPassword(value => !value)}
                  aria-label={showLmsPassword ? "Hide SCU LMS password" : "Show SCU LMS password"}
                  aria-pressed={showLmsPassword}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-blue-700"
                >
                  {showLmsPassword ? "Hide" : "Show"}
                </button>
              </div>

              <button disabled={loading} className="w-full bg-blue-950 text-white p-3 rounded-lg font-semibold">
                {loading ? "Verifying..." : "Verify and Connect"}
              </button>

              <button
                type="button"
                onClick={logout}
                className="w-full border p-3 rounded-lg"
              >
                Cancel / Logout
              </button>
            </form>
          </div>
        );
      }

      // MAIN DASHBOARD

      return (
        <div className="min-h-screen">
          <header className="bg-blue-950 text-white p-4 shadow">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
              <div>
                <h1 className="font-bold text-lg">SCU LMS AI Platform</h1>
                <p className="text-xs text-blue-200">
                  Welcome, {user?.full_name || "Student"}
                </p>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => scanAssignments()}
                  disabled={loading}
                  className="bg-blue-700 px-4 py-2 rounded-lg text-sm"
                >
                  Scan LMS
                </button>
                <button
                  onClick={logout}
                  className="border border-blue-300 px-4 py-2 rounded-lg text-sm"
                >
                  Logout
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-4 md:p-6">
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-4 text-sm">
                {error}
              </div>
            )}

            {message && (
              <div className="bg-green-50 border border-green-200 text-green-800 p-3 rounded-lg mb-4 text-sm">
                {message}
              </div>
            )}

            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
              <div>
                <h2 className="text-2xl font-bold">My Assignments</h2>
                <p className="text-sm text-slate-500">
                  Live assignments scanned from your SCU LMS account.
                </p>
              </div>
              <span className="bg-blue-100 text-blue-900 px-3 py-2 rounded-lg text-sm font-semibold">
                {assignments.length} assignments
              </span>
            </div>

            {assignments.length === 0 ? (
              <div className="bg-white rounded-2xl p-12 text-center shadow-sm">
                <h3 className="font-bold text-lg">No assignments loaded</h3>
                <p className="text-slate-500 text-sm mt-2">
                  Click Scan LMS to retrieve your assignments.
                </p>
                <button
                  onClick={() => scanAssignments()}
                  disabled={loading}
                  className="mt-5 bg-blue-950 text-white px-6 py-3 rounded-lg"
                >
                  {loading ? "Scanning..." : "Scan My LMS"}
                </button>
              </div>
            ) : (
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                {assignments.map((item, index) => (
                  <button
                    key={item.asmnt_cd || item.assignment_id || index}
                    onClick={() => chooseAssignment(item)}
                    disabled={loading}
                    className={`text-left bg-white p-5 rounded-xl border shadow-sm hover:shadow-md ${
                      selected === item ? "border-blue-700 ring-2 ring-blue-100" : "border-slate-200"
                    }`}
                  >
                    <p className="text-xs font-semibold text-blue-700 mb-2">
                      {getCourse(item)}
                    </p>
                    <h3 className="font-bold">{getTitle(item)}</h3>
                    <p className="text-xs text-slate-500 mt-3">
                      Status: {item.submission_status || item.status || "Unknown"}
                    </p>
                    <p className="text-xs text-slate-400 mt-2">
                      Deadline: {item.deadline || item.due_date || "Not available"}
                    </p>
                  </button>
                ))}
              </div>
            )}

            {selected && (
              <section className="mt-8 bg-white rounded-2xl border shadow-sm p-5 md:p-7">
                <div className="flex flex-wrap justify-between gap-3 items-start mb-5">
                  <div>
                    <p className="text-xs font-bold text-blue-700">{getCourse(selected)}</p>
                    <h2 className="text-xl font-bold mt-1">{getTitle(selected)}</h2>
                    <p className="text-xs text-slate-500 mt-2">
                      Submission format: {getSubmissionLabel(getSubmissionType(selected))}
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setSelected(null);
                      setAnswer("");
                      setChatMessages([]);
                      setChatInput("");
                    }}
                    className="text-sm text-slate-500 underline"
                  >
                    Close
                  </button>
                </div>

                <div className="bg-slate-50 rounded-xl p-4 mb-6">
                  <h3 className="font-semibold text-sm mb-2">Assignment Instructions</h3>
                  <p className="text-sm whitespace-pre-wrap">
                    {getInstructions(selected) || "No instructions were extracted by the scanner yet."}
                  </p>
                </div>

                {/* GEMINI CHATBOT */}

                <div className="border border-blue-200 rounded-2xl overflow-hidden mb-7">
                  <div className="bg-blue-950 text-white p-4">
                    <h3 className="font-bold">Gemini Assignment Assistant</h3>
                    <p className="text-xs text-blue-200 mt-1">
                      Ask questions, explain your requirements, or request help with this assignment.
                    </p>
                  </div>

                  <div className="bg-slate-50 p-4 space-y-4 max-h-96 overflow-y-auto">
                    {chatMessages.length === 0 && (
                      <p className="text-sm text-slate-500 text-center">
                        Gemini is preparing to read your assignment...
                      </p>
                    )}

                    {chatMessages.map((msg, index) => (
                      <div
                        key={index}
                        className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}
                      >
                        <div
                          className={`max-w-[85%] rounded-2xl p-3 text-sm whitespace-pre-wrap ${
                            msg.role === "user"
                              ? "bg-blue-950 text-white"
                              : "bg-white border text-slate-800"
                          }`}
                        >
                          <p className="text-xs font-bold mb-1 opacity-70">
                            {msg.role === "user" ? "You" : "Gemini"}
                          </p>
                          {msg.content}
                        </div>
                      </div>
                    ))}

                    {loading && (
                      <p className="text-xs text-slate-500">
                        Gemini is thinking...
                      </p>
                    )}
                  </div>

                  <form onSubmit={sendChatMessage} className="p-3 border-t bg-white">
                    <div className="flex gap-2">
                      <input
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        placeholder="Tell Gemini what you need..."
                        className="flex-1 min-w-0 border rounded-lg px-3 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-700"
                        disabled={loading}
                      />
                      <button
                        type="submit"
                        disabled={loading || !chatInput.trim()}
                        className="bg-blue-950 text-white px-5 rounded-lg text-sm font-semibold disabled:opacity-40"
                      >
                        Send
                      </button>
                    </div>
                  </form>
                </div>

                {/* GENERATE ANSWER */}

                <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                  <h3 className="font-bold">Assignment Generation</h3>
                  <span className="text-xs text-slate-400">
                    You can review and edit the result
                  </span>
                </div>

                <button
                  onClick={generateAnswer}
                  disabled={loading}
                  className="bg-blue-950 text-white px-5 py-3 rounded-lg font-semibold text-sm disabled:opacity-50"
                >
                  {loading ? "Working..." : "Generate Assignment with Gemini"}
                </button>

                <div className="mt-6">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold">Review and Edit Your Answer</h3>
                    <span className="text-xs text-slate-400">Student approval required</span>
                  </div>

                  <textarea
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    placeholder="Your generated answer will appear here. You can edit it before submission."
                    className="w-full min-h-80 border rounded-xl p-4 text-sm leading-relaxed focus:ring-2 focus:ring-blue-700 outline-none"
                  />

                  <div className="mt-4 bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <label className="flex items-start gap-3 text-sm">
                      <input
                        type="checkbox"
                        checked={safeMode}
                        onChange={e => setSafeMode(e.target.checked)}
                        className="mt-1"
                      />
                      <span>
                        <strong>Safe test mode</strong>
                        <br />
                        Test the selected submission workflow without finalizing the LMS submission.
                      </span>
                    </label>
                  </div>

                  <button
                    onClick={submitAssignment}
                    disabled={loading || !answer.trim()}
                    className="mt-4 bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-lg font-semibold text-sm disabled:opacity-50"
                  >
                    {loading
                      ? "Processing..."
                      : `Approve and Test ${getSubmissionLabel(selected ? getSubmissionType(selected) : null)}`}
                  </button>
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
